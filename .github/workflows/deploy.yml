name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - qa
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Holt die Domain entweder aus den Variables oder aus den Secrets:
  BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          echo "Running tests..."
          # Hier können Sie Ihre Testbefehle einfügen, z.B.:
          go test ./...
          echo "Tests completed."

  build:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.set-stage.outputs.stage }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stage bestimmen
        id: set-stage
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "stage=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "qa" ]; then
            echo "stage=qa" >> $GITHUB_OUTPUT
          else
            echo "stage=dev" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set-stage.outputs.stage }}-${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Domain berechnen
        id: calc-domain
        run: |
          STAGE="${{ needs.build.outputs.stage }}"
          BASE="${{ env.BASE_DOMAIN }}"
          
          if [ "$STAGE" = "prod" ]; then
            TARGET_DOMAIN="$BASE"
          else
            TARGET_DOMAIN="${STAGE}.${BASE}"
          fi
          
          echo "domain=${TARGET_DOMAIN}" >> $GITHUB_OUTPUT
          echo "Berechnete Domain: ${TARGET_DOMAIN}"

      - name: Transfer Compose File
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.app.yml"
          target: "/opt/app/${{ needs.build.outputs.stage }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DOMAIN: ${{ steps.calc-domain.outputs.domain }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: APP_DOMAIN
          script: |
            mkdir -p /opt/app/${{ needs.build.outputs.stage }}
            cd /opt/app/${{ needs.build.outputs.stage }}
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            # .env sauber schreiben
            cat << EOF > .env
            DOCKER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            IMAGE_TAG=${{ needs.build.outputs.stage }}-${{ github.sha }}
            STAGE=${{ needs.build.outputs.stage }}
            DOMAIN=$APP_DOMAIN
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF
            
            # Kontrolle in den GitHub-Logs:
            echo "Erstellte .env (ohne Passwörter):"
            grep -v "DB_PASSWORD" .env
            
            docker compose -f docker-compose.app.yml -p "app-${{ needs.build.outputs.stage }}" pull
            docker compose -f docker-compose.app.yml -p "app-${{ needs.build.outputs.stage }}" up -d --force-recreate --remove-orphans
            docker image prune -af --filter "until=24h"