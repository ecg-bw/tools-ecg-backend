openapi: 3.0.3
info:
  title: Weihnachtsmarkt Standplan API
  description: |
    API zur Verwaltung und Digitalisierung des Schichtplans für den Weihnachtsmarktstand.
    Struktur: 1 Edition (Jahr) -> 3 Wochenenden -> je 3 Tage (Fr, Sa, So) -> flexible Schichten mit Helfern und Rollen.
  version: 2.0.0
servers:
  - url: https://api.dev.myjs.org/v1
    description: Lokaler Entwicklungsserver

tags:
  - name: Standplan
    description: Aggregierte Gesamtabfragen für das Schichtplan-Raster
  - name: Editionen
    description: Verwaltung der Markt-Jahre (Editionen)
  - name: Wochenenden & Tage
    description: Wochenenden (1-3) und Markttage (Freitag, Samstag, Sonntag)
  - name: Schichten
    description: Schichten mit flexiblen Beginn-, Endzeiten und Slot-Anzahl
  - name: Helfer
    description: Kontaktdaten und Verfügbarkeiten der freiwilligen Helfer
  - name: Schichtbelegungen
    description: Zuweisung von Helfern und Rollen zu Schichten
  - name: Rollen
    description: Standrollen (z. B. Kasse, Waffeleisen, Glühweinausschank, Standleitung)
  - name: Waffel-Counter
    description: Zähler für verkaufte Waffeln am Stand (Legacy-Feature)

paths:
  # =====================================================================
  # STANDPLAN (AGGREGIERT)
  # =====================================================================
  /editions/{editionId}/standplan:
    get:
      tags:
        - Standplan
      summary: Vollständigen Schichtplan einer Edition abrufen
      description: Liefert den kompletten hierarchischen Standplan (Wochenenden -> Tage -> Schichten -> Belegungen) für die Grid-Ansicht.
      parameters:
        - name: editionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Vollständiger Standplan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandplanResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /editions/active/standplan:
    get:
      tags:
        - Standplan
      summary: Standplan der aktuell aktiven Edition abrufen
      description: Schnelleinstieg für das Stand-Tablet und die öffentliche Helfer-Übersicht.
      responses:
        '200':
          description: Aktueller aktiver Standplan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandplanResponse'
        '404':
          description: Keine aktive Edition gefunden

  # =====================================================================
  # EDITIONEN (JAHRE)
  # =====================================================================
  /editions:
    get:
      tags:
        - Editionen
      summary: Alle Editionen auflisten
      responses:
        '200':
          description: Liste aller Jahre/Editionen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Edition'
    post:
      tags:
        - Editionen
      summary: Neue Edition anlegen (z. B. neues Jahr)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditionCreate'
      responses:
        '210':
          description: Edition erfolgreich erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edition'
        '400':
          $ref: '#/components/responses/BadRequest'

  /editions/{editionId}:
    get:
      tags:
        - Editionen
      summary: Details einer Edition
      parameters:
        - $ref: '#/components/parameters/EditionIdParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edition'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Editionen
      summary: Edition bearbeiten (z. B. aktivieren)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EditionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditionUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edition'

  # =====================================================================
  # SCHICHTEN (SHIFTS)
  # =====================================================================
  /market-days/{dayId}/shifts:
    get:
      tags:
        - Schichten
      summary: Alle Schichten eines bestimmten Tages abrufen
      parameters:
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shift'
    post:
      tags:
        - Schichten
      summary: Neue Schicht für einen Tag anlegen
      security:
        - BearerAuth: []
      parameters:
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'

  /shifts/{shiftId}:
    get:
      tags:
        - Schichten
      summary: Einzelne Schicht inklusive Belegungsstatus abrufen
      parameters:
        - $ref: '#/components/parameters/ShiftIdParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Schichten
      summary: Schichtzeiten oder Slot-Bedarf anpassen
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShiftIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftCreate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
    delete:
      tags:
        - Schichten
      summary: Schicht löschen
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShiftIdParam'
      responses:
        '204':
          description: Schicht gelöscht

  # =====================================================================
  # HELFER (VOLUNTEERS)
  # =====================================================================
  /volunteers:
    get:
      tags:
        - Helfer
      summary: Helferliste abrufen
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          description: Filter nach Name oder E-Mail
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Volunteer'
    post:
      tags:
        - Helfer
      summary: Neuen Helfer registrieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolunteerCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volunteer'
        '409':
          description: E-Mail-Adresse existiert bereits

  /volunteers/{volunteerId}:
    get:
      tags:
        - Helfer
      summary: Helferprofil und persönliche Schichten anzeigen
      parameters:
        - $ref: '#/components/parameters/VolunteerIdParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Helfer
      summary: Helferdaten aktualisieren
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VolunteerIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolunteerCreate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volunteer'

  # =====================================================================
  # SCHICHTBELEGUNGEN (ASSIGNMENTS)
  # =====================================================================
  /shifts/{shiftId}/assignments:
    post:
      tags:
        - Schichtbelegungen
      summary: Helfer in eine Schicht eintragen
      description: Weist einen Helfer einer Schicht zu. Prüft freie Slots und verhindert doppelte Zuweisungen.
      parameters:
        - $ref: '#/components/parameters/ShiftIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreate'
      responses:
        '201':
          description: Zuweisung erfolgreich erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftAssignment'
        '400':
          description: Schicht ist bereits voll belegt oder ungültige Zuweisung
        '409':
          description: Helfer ist dieser Schicht bereits zugewiesen

  /assignments/{assignmentId}:
    patch:
      tags:
        - Schichtbelegungen
      summary: Zuweisungsstatus oder Rolle ändern
      security:
        - BearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftAssignment'
    delete:
      tags:
        - Schichtbelegungen
      summary: Belegung austragen / stornieren
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Belegung erfolgreich gelöscht

  # =====================================================================
  # ROLLEN
  # =====================================================================
  /roles:
    get:
      tags:
        - Rollen
      summary: Liste möglicher Standrollen abrufen
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
    post:
      tags:
        - Rollen
      summary: Neue Standrolle anlegen
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'

  # =====================================================================
  # WAFFEL-COUNTER (STAND-TOOL FEATURE)
  # =====================================================================
  /waffel-counter:
    get:
      tags:
        - Waffel-Counter
      summary: Aktuelle Waffelanzahl abrufen
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  anzahl:
                    type: integer
                    example: 342
    post:
      tags:
        - Waffel-Counter
      summary: Eine Waffel zum Zähler hinzufügen
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                shiftId:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Waffel erfolgreich gezählt
    delete:
      tags:
        - Waffel-Counter
      summary: Waffelzähler zurücksetzen
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Waffelzähler geleert

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EditionIdParam:
      name: editionId
      in: path
      required: true
      schema:
        type: integer
    ShiftIdParam:
      name: shiftId
      in: path
      required: true
      schema:
        type: integer
    VolunteerIdParam:
      name: volunteerId
      in: path
      required: true
      schema:
        type: integer

  responses:
    NotFound:
      description: Ressource nicht gefunden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Ungültige Eingabedaten
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # -------------------------------------------------------------
    # BASIS-SCHEMAS (ENTITIES)
    # -------------------------------------------------------------
    Edition:
      type: object
      properties:
        id:
          type: integer
          example: 1
        year:
          type: integer
          example: 2026
        name:
          type: string
          example: "Weihnachtsmarkt 2026"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time

    EditionCreate:
      type: object
      required:
        - year
        - name
      properties:
        year:
          type: integer
          example: 2026
        name:
          type: string
          example: "Weihnachtsmarkt 2026"
        isActive:
          type: boolean
          default: false

    EditionUpdate:
      type: object
      properties:
        name:
          type: string
        isActive:
          type: boolean

    Weekend:
      type: object
      properties:
        id:
          type: integer
          example: 1
        editionId:
          type: integer
        weekendNumber:
          type: integer
          minimum: 1
          maximum: 3
          example: 1
        label:
          type: string
          example: "1. Adventswochenende"

    MarketDay:
      type: object
      properties:
        id:
          type: integer
          example: 1
        weekendId:
          type: integer
        date:
          type: string
          format: date
          example: "2026-11-27"
        dayOfWeek:
          type: string
          enum: [Freitag, Samstag, Sonntag]
          example: "Freitag"

    Shift:
      type: object
      properties:
        id:
          type: integer
          example: 10
        dayId:
          type: integer
        title:
          type: string
          example: "Aufbau & Frühschicht"
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$'
          example: "14:00:00"
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$'
          example: "17:30:00"
        requiredSlots:
          type: integer
          minimum: 1
          example: 4
        notes:
          type: string
          nullable: true
          example: "Bitte 15 Minuten vor Beginn da sein!"

    ShiftCreate:
      type: object
      required:
        - title
        - startTime
        - endTime
        - requiredSlots
      properties:
        title:
          type: string
          example: "Spätschicht Glühwein"
        startTime:
          type: string
          example: "18:00"
        endTime:
          type: string
          example: "21:30"
        requiredSlots:
          type: integer
          minimum: 1
          example: 3
        notes:
          type: string
          nullable: true

    Volunteer:
      type: object
      properties:
        id:
          type: integer
          example: 5
        firstName:
          type: string
          example: "Jonas"
        lastName:
          type: string
          example: "Müller"
        email:
          type: string
          format: email
          example: "jonas@example.de"
        phone:
          type: string
          nullable: true
          example: "+49 170 1234567"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time

    VolunteerCreate:
      type: object
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
          example: "Laura"
        lastName:
          type: string
          example: "Schmidt"
        email:
          type: string
          format: email
          example: "laura.schmidt@example.de"
        phone:
          type: string
          example: "+49 160 9876543"

    Role:
      type: object
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: "Kasse & Verkauf"
        description:
          type: string
          nullable: true
          example: "Kassieren, Wechselgeld verwalten und Abrechnung"

    RoleCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Waffeleisen"
        description:
          type: string

    ShiftAssignment:
      type: object
      properties:
        id:
          type: integer
          example: 101
        shiftId:
          type: integer
        volunteerId:
          type: integer
        roleId:
          type: integer
          nullable: true
        status:
          type: string
          enum: [pending, confirmed, cancelled]
          example: "confirmed"
        assignedAt:
          type: string
          format: date-time
        volunteer:
          $ref: '#/components/schemas/Volunteer'
        role:
          $ref: '#/components/schemas/Role'

    AssignmentCreate:
      type: object
      required:
        - volunteerId
      properties:
        volunteerId:
          type: integer
          example: 5
        roleId:
          type: integer
          nullable: true
          example: 2
        status:
          type: string
          enum: [pending, confirmed, cancelled]
          default: "confirmed"

    AssignmentUpdate:
      type: object
      properties:
        roleId:
          type: integer
          nullable: true
        status:
          type: string
          enum: [pending, confirmed, cancelled]

    ShiftDetail:
      allOf:
        - $ref: '#/components/schemas/Shift'
        - type: object
          properties:
            occupiedSlots:
              type: integer
              example: 3
            freeSlots:
              type: integer
              example: 1
            assignments:
              type: array
              items:
                $ref: '#/components/schemas/ShiftAssignment'

    VolunteerDetail:
      allOf:
        - $ref: '#/components/schemas/Volunteer'
        - type: object
          properties:
            assignedShifts:
              type: array
              items:
                $ref: '#/components/schemas/ShiftAssignment'

    # -------------------------------------------------------------
    # VOLLSTÄNDIGER STANDPLAN (HIERARCHISCHE FRONTEND-ANSICHT)
    # -------------------------------------------------------------
    StandplanResponse:
      type: object
      properties:
        edition:
          $ref: '#/components/schemas/Edition'
        weekends:
          type: array
          items:
            $ref: '#/components/schemas/StandplanWeekend'

    StandplanWeekend:
      type: object
      properties:
        id:
          type: integer
        weekendNumber:
          type: integer
          example: 1
        label:
          type: string
          example: "1. Adventswochenende"
        days:
          type: array
          items:
            $ref: '#/components/schemas/StandplanDay'

    StandplanDay:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
          example: "2026-11-27"
        dayOfWeek:
          type: string
          enum: [Freitag, Samstag, Sonntag]
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/ShiftDetail'

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "Die gesuchte Schicht existiert nicht."