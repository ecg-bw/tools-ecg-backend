services:
  backend:
    image: ${DOCKER_IMAGE}:${IMAGE_TAG}
    container_name: backend-${STAGE}
    restart: always
    environment:
      - STAGE=${STAGE}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=user_${STAGE}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=db_${STAGE}
    volumes:
      # Mappt den static-Ordner vom Server absolut in den Container nach /app/static
      - /opt/app/backend/${STAGE}/static:/app/static
    networks:
      - web-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web-network"

      # Neue Router-Regel: Horcht auf api.${DOMAIN}
      - "traefik.http.routers.backend-${STAGE}.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      # - "traefik.http.routers.backend-${STAGE}.middlewares=strip-api-prefix"
      # - "traefik.http.middlewares.strip-api-prefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.backend-${STAGE}.entrypoints=websecure"
      - "traefik.http.routers.backend-${STAGE}.tls=true"
      - "traefik.http.routers.backend-${STAGE}.tls.certresolver=myresolver"
      - "traefik.http.services.backend-${STAGE}.loadbalancer.server.port=8080"
    mem_limit: 60m

networks:
  web-network:
    external: true